<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=360">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
<div id="app">

  <div class="header">
    <div class="header-inner">
      <h1>Minerva's Scribe</h1>
      <span class="subtitle">Class Transcriber</span>
    </div>
  </div>

  <!-- tab switcher -->
  <div class="tabs">
    <button class="tab active" data-tab="transcribe">Transcribe</button>
    <button class="tab" data-tab="history">History</button>
  </div>

  <!-- ==================== TRANSCRIBE TAB ==================== -->
  <div id="tab-transcribe" class="tab-content">

    <!-- no class detected -->
    <div id="no-class" class="card notice">
      <p>Navigate to a Forum class page to get started.</p>
      <p class="hint">e.g. forum.minerva.edu/app/courses/…/classes/…</p>
    </div>

    <!-- detected class info -->
    <div id="class-info" class="card" hidden>
      <div class="class-row">
        <span class="dot dot-active"></span>
        <div>
          <div class="label">Detected Class</div>
          <div id="class-title" class="value">—</div>
          <div id="class-id-display" class="value-sm">ID: —</div>
        </div>
      </div>
    </div>

    <!-- options -->
    <div id="options-section" class="card" hidden>
      <div class="field">
        <label for="backend-url">Backend URL</label>
        <input id="backend-url" type="text" value="http://localhost:5001" spellcheck="false">
      </div>
      <div class="row">
        <div class="field half">
          <label for="privacy-mode">Privacy</label>
          <select id="privacy-mode">
            <option value="names">Names</option>
            <option value="ids">IDs only</option>
            <option value="both">Both</option>
          </select>
        </div>
        <div class="field half">
          <label for="whisper-model">Model</label>
          <select id="whisper-model">
            <option value="small">Small</option>
            <option value="medium" selected>Medium</option>
            <option value="large">Large</option>
          </select>
        </div>
      </div>
    </div>

    <!-- action -->
    <div id="action-section" hidden>
      <button id="start-btn" class="btn-primary">Start Transcription &rarr;</button>
    </div>

    <!-- status / progress -->
    <div id="status-section" class="card" hidden>
      <div class="label">Status</div>
      <div id="status-text" class="status-msg">—</div>
      <div class="progress-track"><div id="progress-fill" class="progress-bar"></div></div>
    </div>

    <!-- file downloads -->
    <div id="files-section" class="card" hidden>
      <div class="label">Downloads</div>
      <div id="file-list"></div>
    </div>

    <!-- error -->
    <div id="error-section" class="card card-error" hidden>
      <div class="label">Error</div>
      <div id="error-text"></div>
      <button id="retry-btn" class="btn-secondary">Reset</button>
    </div>

  </div>

  <!-- ==================== HISTORY TAB ==================== -->
  <div id="tab-history" class="tab-content" hidden>

    <div id="history-empty" class="card notice">
      <div class="empty-icon">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#F97316" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      </div>
      <p>No transcriptions yet.</p>
      <p class="hint">Completed transcriptions will appear here.</p>
    </div>

    <div id="history-list" class="history-scroll"></div>

    <button id="clear-history-btn" class="btn-clear" hidden>Clear History</button>
  </div>

</div>
<script src="popup.js"></script>
</body>
</html>
